<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 캠퍼스 공지 내비게이터</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell" aria-label="AI 캠퍼스 공지 내비게이터">
      <section class="app-screen">
        <header class="top-bar">
          <div>
            <p class="eyebrow">컴퓨터공학과 3학년</p>
            <h1>김학생님, 오늘 볼 공지예요</h1>
          </div>
          <button class="profile-button" type="button" aria-label="프로필">
            김
          </button>
        </header>

        <section class="search-card" aria-label="AI 공지 검색">
          <span aria-hidden="true">AI</span>
          <p>학부연구생, 장학금, 인턴 공지를 한 번에 찾아보세요.</p>
        </section>

        <section class="section-block" aria-labelledby="calendarTitle">
          <div class="section-head">
            <h2 id="calendarTitle">이번 주</h2>
            <span>5.13 - 5.19</span>
          </div>
          <div class="week-calendar" id="weekCalendar" aria-label="7일 주간 캘린더"></div>
        </section>

        <section class="today-card" aria-labelledby="todayTitle">
          <div class="section-head">
            <h2 id="todayTitle">오늘 확인해야 할 내용</h2>
            <span>3개</span>
          </div>
          <div class="today-list" id="todayList"></div>
        </section>

        <section class="section-block" aria-labelledby="deadlineTitle">
          <div class="section-head">
            <h2 id="deadlineTitle">이번 주 마감 일정</h2>
            <button type="button">전체</button>
          </div>
          <div class="deadline-list" id="deadlineList"></div>
        </section>

        <section class="section-block" aria-labelledby="recommendTitle">
          <div class="section-head">
            <h2 id="recommendTitle">AI 추천</h2>
            <span>관심 분야 기반</span>
          </div>
          <div class="recommend-scroll" id="recommendList" aria-label="AI 추천 카드"></div>
        </section>

        <section class="section-block recent-section" aria-labelledby="recentTitle">
          <div class="section-head">
            <h2 id="recentTitle">최근 공지</h2>
            <span>최신순</span>
          </div>
          <div class="notice-list" id="noticeList"></div>
        </section>
      </section>

      <button class="fab" type="button" aria-label="공지 추가">+</button>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
